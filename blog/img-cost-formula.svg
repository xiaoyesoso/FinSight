<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="bold">LLM 调用成本归因公式</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">单次模型请求成本 = 输入费用 + 输出费用 + 缓存读取费用</text>

  <!-- Main formula box -->
  <rect x="120" y="78" width="660" height="72" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="450" y="125" text-anchor="middle" fill="#f8fafc" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">C = (Ni × Pi + No × Po + Nc × Pc) ÷ 1,000,000</text>

  <!-- Variable cards -->
  <!-- C -->
  <rect x="50" y="180" width="170" height="90" rx="10" fill="url(#boxGrad)" stroke="#64748b" stroke-width="1"/>
  <text x="135" y="210" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="bold">C</text>
  <text x="135" y="235" text-anchor="middle" fill="#cbd5e1" font-size="11">单次请求总成本</text>
  <text x="135" y="255" text-anchor="middle" fill="#94a3b8" font-size="10">单位：美元 USD</text>

  <!-- Ni / Pi -->
  <rect x="245" y="180" width="170" height="90" rx="10" fill="url(#accentGrad)" opacity="0.9"/>
  <text x="330" y="210" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Ni · Pi</text>
  <text x="330" y="235" text-anchor="middle" fill="#e0e7ff" font-size="11">输入 token 数 × 输入单价</text>
  <text x="330" y="255" text-anchor="middle" fill="#c7d2fe" font-size="10">prompt / 历史 / 工具结果</text>

  <!-- No / Po -->
  <rect x="440" y="180" width="170" height="90" rx="10" fill="url(#accentGrad)" opacity="0.9"/>
  <text x="525" y="210" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">No · Po</text>
  <text x="525" y="235" text-anchor="middle" fill="#e0e7ff" font-size="11">输出 token 数 × 输出单价</text>
  <text x="525" y="255" text-anchor="middle" fill="#c7d2fe" font-size="10">模型生成的文本</text>

  <!-- Nc / Pc -->
  <rect x="635" y="180" width="170" height="90" rx="10" fill="url(#cacheGrad)" opacity="0.9"/>
  <text x="720" y="210" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Nc · Pc</text>
  <text x="720" y="235" text-anchor="middle" fill="#d1fae5" font-size="11">缓存命中 token × 缓存单价</text>
  <text x="720" y="255" text-anchor="middle" fill="#a7f3d0" font-size="10">通常为输入价的 10-20%</text>

  <!-- Arrows from formula to cards -->
  <line x1="450" y1="150" x2="135" y2="180" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="150" x2="330" y2="180" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="150" x2="525" y2="180" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="150" x2="720" y2="180" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Multi-agent rollup -->
  <rect x="120" y="300" width="660" height="90" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="330" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="bold">多代理场景下的总成本</text>
  <text x="450" y="360" text-anchor="middle" fill="#f1f5f9" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Total Cost = Σ C_orchestrator + Σ C_financial + Σ C_industry + Σ C_risk</text>
  <text x="450" y="382" text-anchor="middle" fill="#94a3b8" font-size="11">每个 SubAgent 和主代理各自产生输入/输出，token 走的是加法，缓存命中率越高实际花费越低</text>

  <!-- Arrows from variable cards to rollup -->
  <path d="M135,270 L135,285 L450,285 L450,300" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M720,270 L720,285 L450,285" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Attribution tags -->
  <text x="450" y="430" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="bold">按用户/租户归因</text>
  <rect x="140" y="450" width="220" height="55" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="250" y="475" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">enduser.id</text>
  <text x="250" y="493" text-anchor="middle" fill="#94a3b8" font-size="10">按分析师维度汇总成本</text>

  <rect x="540" y="450" width="220" height="55" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <text x="650" y="475" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600">tenant.id</text>
  <text x="650" y="493" text-anchor="middle" fill="#94a3b8" font-size="10">按团队/租户维度摊销</text>

  <line x1="450" y1="390" x2="450" y2="420" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="420" x2="250" y2="450" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="420" x2="650" y2="450" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- OTel note -->
  <rect x="50" y="525" width="800" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="450" y="545" text-anchor="middle" fill="#64748b" font-size="11">OTel metrics 自动记录 token 数与成本，Grafana 中按 <tspan fill="#93c5fd">enduser.id</tspan> / <tspan fill="#67e8f9">tenant.id</tspan> 聚合即可实现成本分摊</text>
</svg>