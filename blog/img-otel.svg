<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="collectorG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.8"/>
    </linearGradient>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f97316"/>
    </marker>
    <marker id="arr4b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr4g" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arr4p" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="bold">OpenTelemetry 全链路信号流</text>
  <text x="450" y="55" text-anchor="middle" fill="#64748b" font-size="12">CLI 子进程 -> OTLP -> Collector -> Jaeger / Prometheus / Grafana</text>

  <!-- Layer 1: Claude Agent SDK (left) -->
  <rect x="30" y="90" width="180" height="200" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <text x="120" y="115" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Claude Agent SDK</text>
  <text x="120" y="130" text-anchor="middle" fill="#64748b" font-size="9">Python 进程</text>

  <rect x="45" y="145" width="150" height="35" rx="4" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="120" y="167" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="monospace">build_otel_env()</text>

  <rect x="45" y="190" width="150" height="85" rx="4" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="55" y="207" fill="#fbbf24" font-size="8" font-family="monospace">CLAUDE_CODE_ENABLE_TELEMETRY=1</text>
  <text x="55" y="220" fill="#fbbf24" font-size="8" font-family="monospace">ENHANCED_TELEMETRY_BETA=1</text>
  <text x="55" y="233" fill="#34d399" font-size="8" font-family="monospace">OTEL_METRICS_EXPORTER=otlp</text>
  <text x="55" y="246" fill="#60a5fa" font-size="8" font-family="monospace">OTEL_TRACES_EXPORTER=otlp</text>
  <text x="55" y="259" fill="#a855f7" font-size="8" font-family="monospace">OTEL_LOGS_EXPORTER=otlp</text>
  <text x="55" y="272" fill="#64748b" font-size="7" font-family="monospace">-> env=ClaudeAgentOptions.env</text>

  <!-- CLI subprocess -->
  <rect x="45" y="285" width="150" height="0" fill="none"/>

  <!-- Arrow: SDK -> CLI -->
  <text x="120" y="300" text-anchor="middle" fill="#475569" font-size="9">env 透传</text>

  <!-- CLI Subprocess -->
  <rect x="30" y="310" width="180" height="50" rx="8" fill="#1a2332" stroke="#475569" stroke-width="1"/>
  <text x="120" y="332" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Claude Code CLI</text>
  <text x="120" y="348" text-anchor="middle" fill="#64748b" font-size="9">内置 OTel 插桩</text>

  <!-- Arrow: CLI -> Collector -->
  <line x1="215" y1="335" x2="330" y2="335" stroke="#f97316" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="270" y="328" text-anchor="middle" fill="#f97316" font-size="9" font-weight="600">OTLP/HTTP</text>
  <text x="270" y="350" text-anchor="middle" fill="#64748b" font-size="8">:4318</text>

  <!-- Layer 2: OTel Collector -->
  <rect x="335" y="140" width="170" height="210" rx="10" fill="url(#collectorG)" opacity="0.85"/>
  <text x="420" y="168" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">OTel Collector</text>
  <text x="420" y="183" text-anchor="middle" fill="#fed7aa" font-size="9">数据枢纽</text>

  <!-- Receivers -->
  <rect x="350" y="195" width="140" height="30" rx="4" fill="#7c2d12" opacity="0.8"/>
  <text x="420" y="215" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Receivers</text>
  <text x="420" y="225" text-anchor="middle" fill="#fed7aa" font-size="8">OTLP HTTP :4318</text>

  <!-- Processors -->
  <rect x="350" y="235" width="140" height="25" rx="4" fill="#7c2d12" opacity="0.8"/>
  <text x="420" y="252" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Processors: batch</text>

  <!-- Exporters -->
  <rect x="350" y="270" width="140" height="65" rx="4" fill="#7c2d12" opacity="0.8"/>
  <text x="420" y="287" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Exporters</text>
  <text x="365" y="302" fill="#fed7aa" font-size="8">-> otlp/jaeger</text>
  <text x="365" y="315" fill="#fed7aa" font-size="8">-> prometheus :8889</text>
  <text x="365" y="328" fill="#fed7aa" font-size="8">-> debug (detailed)</text>

  <!-- Arrows: Collector -> 3 backends -->
  <!-- -> Jaeger -->
  <line x1="510" y1="200" x2="620" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr4b)"/>
  <text x="565" y="180" fill="#3b82f6" font-size="8">traces</text>

  <!-- -> Prometheus -->
  <line x1="510" y1="250" x2="620" y2="250" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr4g)"/>
  <text x="565" y="245" fill="#22c55e" font-size="8">metrics</text>

  <!-- -> Grafana -->
  <line x1="510" y1="300" x2="620" y2="330" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr4p)"/>
  <text x="565" y="320" fill="#a855f7" font-size="8">logs</text>

  <!-- Layer 3: Backends -->
  <!-- Jaeger -->
  <rect x="625" y="130" width="130" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <text x="690" y="155" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">🔍 Jaeger</text>
  <text x="690" y="172" text-anchor="middle" fill="#64748b" font-size="9">调用链 UI</text>
  <text x="690" y="188" text-anchor="middle" fill="#475569" font-size="8">:16686</text>

  <!-- Prometheus -->
  <rect x="625" y="215" width="130" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
  <text x="690" y="240" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">📊 Prometheus</text>
  <text x="690" y="257" text-anchor="middle" fill="#64748b" font-size="9">指标存储</text>
  <text x="690" y="273" text-anchor="middle" fill="#475569" font-size="8">:9090</text>

  <!-- Grafana -->
  <rect x="625" y="300" width="130" height="70" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.9"/>
  <text x="690" y="325" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">📈 Grafana</text>
  <text x="690" y="342" text-anchor="middle" fill="#64748b" font-size="9">统一大盘</text>
  <text x="690" y="358" text-anchor="middle" fill="#475569" font-size="8">:3000</text>

  <!-- Signal types legend (bottom) -->
  <rect x="30" y="395" width="840" height="70" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <rect x="50" y="408" width="12" height="12" rx="2" fill="#34d399"/>
  <text x="70" y="418" fill="#cbd5e1" font-size="9" font-weight="600">Metrics</text>
  <text x="70" y="432" fill="#64748b" font-size="8">token 数 · 成本 · 会话数 · 工具决策</text>
  <text x="70" y="445" fill="#475569" font-size="7">OTEL_METRICS_EXPORTER=otlp</text>

  <rect x="300" y="408" width="12" height="12" rx="2" fill="#60a5fa"/>
  <text x="320" y="418" fill="#cbd5e1" font-size="9" font-weight="600">Traces</text>
  <text x="320" y="432" fill="#64748b" font-size="8">Agent -> SubAgent -> Tool -> LLM span</text>
  <text x="320" y="445" fill="#475569" font-size="7">+ CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1</text>

  <rect x="600" y="408" width="12" height="12" rx="2" fill="#a855f7"/>
  <text x="620" y="418" fill="#cbd5e1" font-size="9" font-weight="600">Log Events</text>
  <text x="620" y="432" fill="#64748b" font-size="8">prompt · API 请求 · 工具结果 · 错误</text>
  <text x="620" y="445" fill="#475569" font-size="7">OTEL_LOGS_EXPORTER=otlp</text>

  <!-- Docker Compose note -->
  <text x="420" y="380" text-anchor="middle" fill="#f97316" font-size="8" font-weight="600">docker compose -f docker-compose.yml up -d</text>
</svg>
