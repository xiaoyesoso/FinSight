<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="agentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="agentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="agentGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="bold">FinSight 多代理架构总览</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">Browser → FastAPI → Orchestrator → 3 SubAgents → MCP / Skills</text>

  <!-- Browser Layer -->
  <rect x="300" y="75" width="300" height="50" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <text x="450" y="98" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">React + TypeScript + Vite</text>
  <text x="450" y="115" text-anchor="middle" fill="#64748b" font-size="10">SSE EventSource · 3 Panels · i18n</text>

  <!-- Arrow: Browser -> FastAPI -->
  <line x1="450" y1="125" x2="450" y2="145" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="465" y="138" fill="#3b82f6" font-size="9">HTTP / SSE</text>

  <!-- FastAPI Layer -->
  <rect x="300" y="145" width="300" height="50" rx="8" fill="#1a2332" stroke="#64748b" stroke-width="1.5" opacity="0.9"/>
  <text x="450" y="168" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">FastAPI Backend</text>
  <text x="450" y="185" text-anchor="middle" fill="#64748b" font-size="10">POST /api/research · GET /stream · RunManager</text>

  <!-- Arrow: FastAPI -> Orchestrator -->
  <line x1="450" y1="195" x2="450" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="275" y="215" width="350" height="55" rx="10" fill="url(#orchGrad)" filter="url(#glow)"/>
  <text x="450" y="240" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Orchestrator Agent</text>
  <text x="450" y="258" text-anchor="middle" fill="#e0e7ff" font-size="10">ClaudeAgentOptions · permission_mode=bypassPermissions</text>

  <!-- Arrows: Orchestrator -> 3 SubAgents -->
  <path d="M350,270 Q280,290 200,310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450,270 L450,310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550,270 Q620,290 700,310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="265" y="293" fill="#94a3b8" font-size="9">Agent Tool</text>
  <text x="455" y="293" fill="#94a3b8" font-size="9">Agent Tool</text>
  <text x="575" y="293" fill="#94a3b8" font-size="9">Agent Tool</text>

  <!-- SubAgent 1: Financial Analyzer -->
  <rect x="80" y="310" width="240" height="65" rx="8" fill="url(#agentGrad1)" opacity="0.9"/>
  <text x="200" y="335" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">📊 financial-analyzer</text>
  <text x="200" y="352" text-anchor="middle" fill="#cffafe" font-size="10">财报分析 · PDF解析 · DCF估值</text>
  <text x="200" y="367" text-anchor="middle" fill="#67e8f9" font-size="9">Skill: financial-report-analyzer</text>

  <!-- SubAgent 2: Industry News -->
  <rect x="330" y="310" width="240" height="65" rx="8" fill="url(#agentGrad2)" opacity="0.9"/>
  <text x="450" y="335" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">📰 industry_news_collector</text>
  <text x="450" y="352" text-anchor="middle" fill="#d1fae5" font-size="10">行业新闻 · 舆情监控 · 热点排名</text>
  <text x="450" y="367" text-anchor="middle" fill="#6ee7b7" font-size="9">Skill: industry-news-collector</text>

  <!-- SubAgent 3: Risk Alert -->
  <rect x="580" y="310" width="240" height="65" rx="8" fill="url(#agentGrad3)" opacity="0.9"/>
  <text x="700" y="335" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">⚠️ a-share-risk-alert</text>
  <text x="700" y="352" text-anchor="middle" fill="#fef3c7" font-size="10">风险预警 · 退市信号 · 涨跌异动</text>
  <text x="700" y="367" text-anchor="middle" fill="#fcd34d" font-size="9">Skill: a-share-risk-alert</text>

  <!-- Bottom layer: MCP + Hooks + Telemetry -->
  <!-- MCP Server -->
  <rect x="80" y="410" width="200" height="45" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
  <text x="180" y="430" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">🌐 Bocha MCP Server</text>
  <text x="180" y="446" text-anchor="middle" fill="#64748b" font-size="9">mcp__websearch__bochasearch</text>

  <!-- Hooks -->
  <rect x="320" y="410" width="200" height="45" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" opacity="0.9"/>
  <text x="420" y="430" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">🛡️ Governance Hooks</text>
  <text x="420" y="446" text-anchor="middle" fill="#64748b" font-size="9">PreToolUse · PostToolUse · Audit</text>

  <!-- OpenTelemetry -->
  <rect x="560" y="410" width="200" height="45" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
  <text x="660" y="430" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600">📡 OpenTelemetry</text>
  <text x="660" y="446" text-anchor="middle" fill="#64748b" font-size="9">Traces · Metrics · Log Events → OTLP</text>

  <!-- Connection lines from SubAgents to bottom -->
  <line x1="200" y1="375" x2="200" y2="410" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="450" y1="375" x2="450" y2="410" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="375" x2="700" y2="410" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Session Management badge -->
  <rect x="50" y="480" width="800" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="450" y="500" text-anchor="middle" fill="#64748b" font-size="11">Session Modes: <tspan fill="#93c5fd">fresh</tspan> (new UUID) · <tspan fill="#86efac">resume</tspan> (rehydrate) · <tspan fill="#fcd34d">fork</tspan> (clone + isolate) → session_id attached to final_result SSE event</text>
</svg>
